<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Culling Bay Monitor</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> Culling&nbsp;Bay <small>monitor</small></div>
    <a class="applink" href="/m/" title="Culling, search and the gallery are in the phone app">Phone app &rarr;</a>
    <div class="monitor dead" id="monitor" title="Live run monitor">
      <span class="dotlive"></span>
      <div class="mon-prog">
        <div class="row"><span id="mon-label">run</span><b id="mon-count">-- / --</b></div>
        <div class="bar"><i id="mon-bar"></i></div>
      </div>
      <div class="mon-stat">
        <div><b id="mon-rate">--</b> img/hr</div>
        <div><span class="e" id="mon-err">0 err</span> &middot; <span id="mon-eta">--</span></div>
      </div>
    </div>
  </header>

  <main id="monitor-body"></main>
</div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
